name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Swoop.sln -c Release

      - name: Test
        # the E2E tests do two small real downloads; give them room
        run: dotnet test tests/Swoop.Core.Tests/Swoop.Core.Tests.csproj -c Release --filter "Category!=E2E"

